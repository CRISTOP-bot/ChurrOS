---
# finished — pantalla final del instalador.
# restartNowMode (Calamares 3.4.x):
#   never           → no muestra botón ni reinicia
#   user-unchecked  → muestra el checkbox "Reiniciar ahora" (sin marcar)
#   user-checked    → muestra el checkbox marcado por defecto
#   always          → muestra el botón, marcado y sin poder cambiar
# restartNowCommand se fuerza a systemctl -i reboot para que el reinicio no
# dependa de la sesión del desktop live (evita cuelgues al reiniciar desde
# Calamares).
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
