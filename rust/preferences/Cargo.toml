[package]
name = "churros-settings"
version = "0.1.0"
edition = "2024"
description = "ChurrOS Preferences (centro de configuración) — port Rust de preferences/"

# Sin deploy: port en curso (solo system + about portadas de 30 páginas).
# Cuando esté completo, añadir: [package.metadata.churros] deploy = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
gio = "0.22.8"
glib = "0.22.8"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
serde_json = "1"
